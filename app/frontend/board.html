<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>11.18 投递看板</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:#f4f6f9;color:#1a1d23;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:86px}
/* 顶部 */
.hero{background:linear-gradient(140deg,#1b3350,#2c5282);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(16,24,40,.12)}
.hero .t1{font-size:15px;font-weight:700;letter-spacing:.2px}
.hero .t2{font-size:11.5px;opacity:.82;margin-top:2px}
.bar{margin-top:11px;height:9px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ffb703);border-radius:99px;transition:width .3s}
.nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:11.5px;opacity:.9}
.nums b{font-size:15px;font-weight:800;color:#ffd166}
/* 筛选 */
.filters{padding:10px 14px 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid #d8dde5;background:#fff;color:#4a5361;font-weight:600}
.chip.on{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
.chip.warn.on{background:#c02b2b;border-color:#c02b2b}
.searchwrap{padding:6px 14px 2px;display:flex;gap:8px}
.searchwrap input{flex:1;min-width:0;padding:9px 12px;border:1px solid #dde1e8;border-radius:10px;font-size:13px;outline:none;background:#fff}
.searchwrap input:focus{border-color:#2c5282}
.tip{font-size:11px;color:#8b93a1;padding:8px 16px 4px;line-height:1.6}
/* 公司卡 */
.sec{padding:12px 14px 2px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:13px;margin:0;color:#4a5361;letter-spacing:.3px}
.sec span{font-size:11px;color:#9aa3b0}
.card{background:#fff;margin:9px 14px;border:1px solid #e7eaef;border-radius:13px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card.done{opacity:.62}
.chd{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid #f0f2f6;background:#fcfdff}
.chd .info{flex:1;min-width:0}
.chd h3{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-all}
.chd .sub{font-size:10.5px;color:#8b93a1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{flex:0 0 auto;font-size:11px;font-weight:700;color:#2c5282;background:#eef3fa;padding:3px 8px;border-radius:99px}
.cnt.all{color:#276749;background:#e8f5ec}
/* 岗位行 */
.job{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid #f5f6f9;align-items:flex-start;position:relative}
.job:last-of-type{border-bottom:none}
.job .box{flex:0 0 auto;width:21px;height:21px;margin-top:2px;border:2px solid #cbd2dc;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s}
.job.applied .box{background:#2f855a;border-color:#2f855a}
.job.applied .box::after{content:"✓"}
.job .body{flex:1;min-width:0}
.job .nm{font-size:13.5px;font-weight:650;line-height:1.4;transition:.15s}
.job .nm em{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:#c02b2b;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
.job .nm em.b{background:#d97706}
.job .nm em.c{background:#94a3b8}
.job.applied .nm{text-decoration:line-through;color:#98a1ae;font-weight:500}
.job .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.job .m span{font-size:10.5px;color:#5b6472;background:#f2f4f7;padding:1px 6px;border-radius:4px}
.job .pay{font-size:12.5px;font-weight:800;color:#c02b2b;margin-top:5px}
.job .pay small{font-weight:500;color:#8b93a1;font-size:10.5px;margin-left:5px}
.job.applied .pay{color:#98a1ae}
.job .why{font-size:11px;color:#5b6472;margin-top:5px;padding-left:1px;border-left:2px solid #e3e8f0;padding-left:7px}
/* 备注 */
.note{padding:10px 13px 12px;background:#fbfcfe;border-top:1px dashed #e3e8f0}
.note label{display:block;font-size:10.5px;color:#8b93a1;margin-bottom:4px;font-weight:600;letter-spacing:.3px}
.note textarea{width:100%;min-height:44px;border:1px solid #e3e8f0;background:#fff;border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;line-height:1.5;resize:vertical;outline:none;color:#1a1d23}
.note textarea:focus{border-color:#2c5282;box-shadow:0 0 0 3px rgba(44,82,130,.07)}
.note textarea::placeholder{color:#b6bdc8}
/* 底部条 */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid #e7eaef;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:40}
.dock button{flex:1;padding:11px 6px;border-radius:10px;border:none;font-size:13px;font-weight:700;font-family:inherit}
.b1{background:#1e3a5f;color:#fff}
.b2{background:#eef1f5;color:#3d4653}
.b3{background:#fff;color:#c02b2b;border:1px solid #f0d5d5 !important}
.empty{text-align:center;color:#9aa3b0;font-size:13px;padding:44px 20px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(26,29,35,.92);color:#fff;font-size:13px;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;font-size:10.5px;color:#a3aab6;padding:18px 20px 6px;line-height:1.8}
</style></head>

var st = JSON.parse(localStorage.getItem(KEY) || '{}');
if(!st.a) st.a = {};      // gid -> 1 已投
if(!st.n) st.n = {};      // 公司 -> 备注
function save(){ localStorage.setItem(KEY, JSON.stringify(st)); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1400); }

var byCo = [];
var idx = {};
RAW.forEach(function(j){
  if(!(j.c in idx)){ idx[j.c]=byCo.length; byCo.push({c:j.c, ind:j.ind, size:j.size, jobs:[]}); }
  byCo[idx[j.c]].jobs.push(j);
});
byCo.forEach(function(co){ co.jobs.sort(function(a,b){ return (b.lo||0)-(a.lo||0); }); co.max = Math.max.apply(null, co.jobs.map(function(j){return j.hi||j.lo||0;})); });
var RANK={A:0,B:1,C:2};
byCo.sort(function(a,b){
  var ra=(RANK[a.jobs[0].lv]!==undefined?RANK[a.jobs[0].lv]:3), rb=(RANK[b.jobs[0].lv]!==undefined?RANK[b.jobs[0].lv]:3);
  if(ra!==rb) return ra-rb;
  return (b.max||0)-(a.max||0);
});

var F = {sal:'g10', q:'', todo:false};
var openNotes = {};

function passSal(j){
  if(F.sal==='all') return true;
  if(!j.lo) return F.sal!=='g10' && F.sal!=='g12' ? true : false;
  if(F.sal==='g10') return j.lo >= 10000;
  if(F.sal==='g12') return j.lo >= 12000;
  return true;
}
function applyMatches(co){
  return co.jobs.filter(function(j){
    if(!passSal(j)) return false;
    if(F.todo && st.a[j.i]) return false;
    if(F.q){
      var s=(co.c+' '+j.j+' '+(j.ind||'')+' '+(j.note||'')).toLowerCase();
      if(s.indexOf(F.q)<0) return false;
    }
    return true;
  });
}
function fmt(n){ return (n/1000).toFixed(1).replace('.0','')+'k'; }
function payTxt(j){
  if(!j.lo) return '未披露';
  if(j.hi && j.hi!==j.lo) return fmt(j.lo)+'–'+fmt(j.hi);
  return fmt(j.lo);
}

function render(){
  var list = document.getElementById('list');
  var html = '', shownJobs = 0, totalJobs = 0, doneJobs = 0;
  byCo.forEach(function(co){
    var js = applyMatches(co);
    co.jobs.forEach(function(j){ totalJobs++; if(st.a[j.i]) doneJobs++; });
    if(!js.length) return;
    shownJobs += js.length;
    var doneInCo = js.filter(function(j){return st.a[j.i];}).length;
    var allDone = doneInCo===js.length;
    html += '<section class="card'+(allDone?' done':'')+'" data-co="'+esc(co.c)+'">';
    html += '<div class="chd"><div class="info"><h3>'+esc(co.c)+'</h3><div class="sub">'+esc(co.ind||'')+(co.size?' · '+esc(co.size):'')+'</div></div>'
          + '<span class="cnt'+(allDone?' all':'')+'">'+doneInCo+'/'+js.length+'</span></div>';
    js.forEach(function(j){
      var ap = st.a[j.i] ? ' applied':'';
      html += '<div class="job'+ap+'" data-i="'+j.i+'">'
        + '<div class="box"></div>'
        + '<div class="body">'
        +   '<div class="nm">'+esc(j.j)+(j.lv?'<em class="'+j.lv.toLowerCase()+'">'+j.lv+'</em>':'')+'</div>'
        +   '<div class="pay">'+payTxt(j)+'<small>'+esc(j.note)+'</small></div>'
        +   '<div class="m"><span>'+esc(j.edu)+'</span><span>招 '+esc(String(j.n))+' 人</span><span>'+esc(j.loc)+'</span>'+(j.y?'<span>标 '+esc(String(j.y))+' 万/年</span>':'')+'</div>'
        +   (j.why?'<div class="why">'+esc(j.why)+'</div>':'')
        + '</div></div>';
    });
    var noteVal = st.n[co.c] || '';
    html += '<div class="note"><label>现场记录</label>'
          + '<textarea data-co="'+esc(co.c)+'" placeholder="HR 说了什么 / 面试几轮 / 要不要网申 / 下一步">'+esc(noteVal)+'</textarea></div>';
    html += '</section>';
  });
  if(!html) html = '<div class="empty">这个条件下没有岗位<br>换个筛选试试</div>';
  list.innerHTML = html;
  document.getElementById('tgtN').textContent = shownJobs;
  document.getElementById('doneN').textContent = doneJobs;
  var p = shownJobs ? Math.round(doneJobs/shownJobs*100) : 0;
  document.getElementById('pb').style.width = p+'%';
  document.getElementById('pct').textContent = p+'%';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// 事件委托
document.getElementById('list').addEventListener('click', function(e){
  var row = e.target.closest('.job');
  if(row && !e.target.closest('.note')){
    var id = row.dataset.i;
    if(st.a[id]) delete st.a[id]; else st.a[id] = 1;
    save(); row.classList.toggle('applied');
    var co = row.closest('.card');
    var js = co.querySelectorAll('.job');
    var dn = co.querySelectorAll('.job.applied').length;
    var cnt = co.querySelector('.cnt');
    cnt.textContent = dn+'/'+js.length;
    cnt.classList.toggle('all', dn===js.length);
    co.classList.toggle('done', dn===js.length);
    var d=0; document.querySelectorAll('.card').forEach(function(c){ if(c.classList.contains('done')) d++; });
    var all=document.querySelectorAll('.job'), ap=document.querySelectorAll('.job.applied');
    document.getElementById('doneN').textContent = ap.length;
    var p = all.length? Math.round(ap.length/all.length*100):0;
    document.getElementById('pb').style.width=p+'%';
    document.getElementById('pct').textContent=p+'%';
  }
});
document.getElementById('list').addEventListener('input', function(e){
  if(e.target.tagName==='TEXTAREA'){
    st.n[e.target.dataset.co] = e.target.value; save();
  }
});

document.getElementById('filters').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  var f = b.dataset.f;
  if(f==='todo'){ F.todo = !F.todo; b.classList.toggle('on', F.todo); }
  else { F.sal = f; [].forEach.call(this.querySelectorAll('.chip'), function(c){ if(c.dataset.f!=='todo') c.classList.toggle('on', c===b); }); }
  render();
});
document.getElementById('q').addEventListener('input', function(){ F.q = this.value.trim().toLowerCase(); render(); });

document.getElementById('exp').onclick = function(){
  var lines = ['# 11.18 电子院招聘会 投递记录',''];
  var applied=[], pending=[], notes=[];
  byCo.forEach(function(co){
    var a = co.jobs.filter(function(j){return st.a[j.i];});
    if(a.length) applied.push('- **'+co.c+'**：'+a.map(function(j){return j.j+'（'+payTxt(j)+'/月）';}).join('、'));
    var p = co.jobs.filter(function(j){return !st.a[j.i];});
    if(p.length) pending.push('- '+co.c+'：'+p.map(function(j){return j.j;}).join('、'));
    if(st.n[co.c]) notes.push('### '+co.c+'\n'+st.n[co.c]);
  });
  lines.push('## 已投 '+applied.length+' 家');
  lines = lines.concat(applied.length?applied:['- （还没有）']);
  lines.push('','## 没投的','');
  lines = lines.concat(pending);
  if(notes.length){ lines.push('','## 现场记录',''); lines = lines.concat(notes); }
  var txt = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制，粘给我帮你整理'); }, function(){ fallback(txt); });
  } else fallback(txt);
  function fallback(t){
    var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast('已复制，粘给我帮你整理');}catch(e){ alert(t); }
    document.body.removeChild(ta);
  }
};
document.getElementById('rst').onclick = function(){
  if(confirm('清空所有打勾和记录？这个操作不能撤销。')){
    st={a:{},n:{}}; save(); render(); toast('已清空');
  }
};

// 倒计时到 16:00
function tick(){
  var now = new Date();
  var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 16, 0, 0);
  var d = Math.floor((end-now)/1000);
  var el = document.getElementById('cd');
  if(d<=0){ el.textContent='已结束'; return; }
  var h=Math.floor(d/3600), m=Math.floor(d%3600/60);
  el.textContent = '还剩 '+h+' 小时 '+m+' 分';
}
tick(); setInterval(tick, 30000);
render();
</script>
</body></html>
